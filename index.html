<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><link rel="manifest" href="manifest.webmanifest"><title>Workshop AI – BMW</title><style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#f3f5fa;font:16px -apple-system,BlinkMacSystemFont,Arial,sans-serif}main{max-width:760px;margin:auto;padding:24px 18px 90px}h1{color:#facc15;font-size:29px;margin:0 0 6px}.sub{color:#b9c3d2;margin-bottom:25px}input,select{width:100%;padding:15px;background:#263243;color:white;border:1px solid #465369;border-radius:12px;font-size:16px;margin:0 0 12px}label{display:block;color:#c8d2df;font-size:13px;margin:8px 0}.card{border:1px solid #344258;background:#1d293a;border-radius:15px;padding:17px;margin:12px 0}button{border:0;border-radius:10px;padding:12px 15px;background:#facc15;color:#141c2c;font-size:15px;font-weight:700}button.secondary{background:#344258;color:white}.muted{color:#aebaca;font-size:14px}.pill{display:inline-block;background:#334257;border-radius:20px;padding:4px 9px;font-size:12px;margin:4px 4px 0 0}.row{display:flex;gap:9px;justify-content:space-between;align-items:center}.row>div{flex:1}#detail{display:none}h2{font-size:19px}h3{font-size:16px;color:#facc15}details{border-top:1px solid #435066;padding:12px 0}summary{cursor:pointer;font-weight:600}.notice{border-left:3px solid #facc15;padding-left:12px;color:#cbd5e1;font-size:14px}#status{font-size:13px;color:#b7e3c2;margin-top:8px}</style></head><body><main><h1>🔧 Workshop AI</h1><div class="sub">BMW-Fahrzeugdatenbank · Offline</div><section id="browse"><label for="search">Fahrzeug suchen</label><input id="search" placeholder="z. B. E91, 320d, M47, 2007"><label for="series">Baureihe</label><select id="series"><option value="">Alle Baureihen</option></select><div class="row"><div class="muted" id="count"></div><button class="secondary" id="reset">Zurücksetzen</button></div><div id="results"></div></section><section id="detail"><button class="secondary" id="back">← Zurück zur Suche</button><div id="vehicle"></div><h2>Werkstattdaten</h2><p class="notice">Noch keine verifizierten Drehmomente, Reifendrücke oder Reparaturanleitungen hinterlegt. Keine Werte schätzen oder aus anderen Motorvarianten übertragen.</p><div id="sections"></div></section><div id="status" role="status"></div></main><script src="vehicles.js"></script><script>
const vehicles=window.WORKSHOP_VEHICLES||[];const search=document.querySelector('#search'),series=document.querySelector('#series'),results=document.querySelector('#results');const groups=[...new Set(vehicles.map(v=>v.series))].sort();for(const g of groups){const o=document.createElement('option');o.value=g;o.textContent=g;series.append(o)}
function textNode(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e}
function render(){const q=search.value.trim().toLocaleLowerCase('de');const hits=vehicles.filter(v=>(!series.value||v.series===series.value)&&(!q||Object.values(v).join(' ').toLocaleLowerCase('de').includes(q)));document.querySelector('#count').textContent=`${hits.length} von ${vehicles.length} Fahrzeugvarianten`;results.replaceChildren();for(const v of hits){const card=textNode('article','', 'card');card.append(textNode('h2',`${v.brand} ${v.model} (${v.series})`),textNode('div',`${v.years} · ${v.engine} · ${v.power}`, 'muted'));const btn=textNode('button','Fahrzeug öffnen');btn.style.marginTop='12px';btn.addEventListener('click',()=>openVehicle(v));card.append(btn);results.append(card)}if(!hits.length)results.append(textNode('p','Keine passenden Einträge gefunden.'))}
function openVehicle(v){document.querySelector('#browse').hidden=true;document.querySelector('#detail').style.display='block';const out=document.querySelector('#vehicle');out.replaceChildren();const card=textNode('div','', 'card');card.append(textNode('h2',`${v.brand} ${v.model}`),textNode('p',`Baureihe: ${v.series}`),textNode('p',`Baujahre (Orientierung): ${v.years}`),textNode('p',`Motorfamilie: ${v.engine}`),textNode('p',`Leistung: ${v.power}`),textNode('p','Motorcode und Fahrzeugausführung vor Reparatur anhand FIN/Herstellerunterlagen prüfen.','muted'));out.append(card);const sections=document.querySelector('#sections');sections.replaceChildren();for(const name of ['Drehmomente','Reifendruck','Betriebsstoffe','Montage- und Reparaturanleitungen']){const d=document.createElement('details');d.append(textNode('summary',name),textNode('p','Noch keine freigegebenen technischen Daten für diese Variante vorhanden.','muted'));sections.append(d)}window.scrollTo(0,0)}
document.querySelector('#back').onclick=()=>{document.querySelector('#browse').hidden=false;document.querySelector('#detail').style.display='none'};document.querySelector('#reset').onclick=()=>{search.value='';series.value='';render()};search.addEventListener('input',render);series.addEventListener('change',render);render();if('serviceWorker'in navigator){navigator.serviceWorker.register('./sw.js').then(()=>document.querySelector('#status').textContent='Offline-Speicherung aktiviert – nach dem ersten Laden offline testen.').catch(()=>document.querySelector('#status').textContent='Offline-Cache konnte nicht aktiviert werden.')}else document.querySelector('#status').textContent='Offline-Cache wird von diesem Browser nicht unterstützt.';
</script></body></html>
